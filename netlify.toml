# netlify.toml
# Purpose: fix duplicate-URL indexing (e.g. /contact AND /contact.html both
# getting indexed by Google as separate pages). Since canonical tags and
# sitemap.xml already point to the .html versions, we 301-redirect the
# extension-less ("pretty URL") versions to their .html counterparts so
# there is only ONE canonical URL per page.

[[redirects]]
  from = "/about"
  to = "/about.html"
  status = 301
  force = true

[[redirects]]
  from = "/contact"
  to = "/contact.html"
  status = 301
  force = true

